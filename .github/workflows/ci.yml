name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/aegistrace || true
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Integration tests
        run: pytest tests/integration -v
      - name: Security tests
        run: pytest tests/security -v
      - name: Privacy tests
        run: pytest tests/privacy -v
      - name: Permanence tests
        run: pytest tests/permanence -v
      - name: Conformance tests
        run: pytest tests/conformance -v
